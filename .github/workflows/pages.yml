# ============================================================================
# GitHub Pages 部署流水线：测试 → 重建画廊索引 → 部署
#   - push 到 main 自动触发；也可在 Actions 页手动触发（workflow_dispatch）
#   - 任何一步失败都不会部署（坏提交不会上线画廊）
#   - 零依赖：项目无 npm install；测试为 Node 原生脚本
# ============================================================================
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ① 回归测试：导出全部组件项目 + 包一致性 + 颜色 + 形状 + 公式 + 图标
      - name: 回归测试
        run: npm test

      # ② 重建静态画廊索引（examples/manifest.json），保证与 examples/ 一致
      - name: 重建画廊索引
        run: node bin/open-pptd.js gallery scan

      # ③ 部署产物瘦身：去掉 .git（artifact 只需站点文件）
      - name: 清理产物
        run: rm -rf .git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
