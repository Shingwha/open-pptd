<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>open-pptd · 编辑器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="editor-app">
      <!-- 顶栏 -->
      <header class="topbar">
        <a class="btn btn-topbar-home" href="../" title="返回作品画廊">
          <span class="btn-ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
          <span class="btn-label">画廊</span>
        </a>
        <div class="brand">
          <span class="brand-dot"></span>
          <strong>open-pptd</strong>
          <span class="brand-file" id="brand-file"></span>
        </div>
        <div class="topbar-actions">
          <span class="topbar-divider"></span>
          <button id="btn-undo" class="icon-btn" title="撤销 (Ctrl+Z)">
            <svg viewBox="0 0 24 24"><path d="M8 7L4 11l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 11h10a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-redo" class="icon-btn" title="重做 (Ctrl+Y)">
            <svg viewBox="0 0 24 24"><path d="M16 7l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 11H10a5 5 0 0 0 0 10h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <span class="topbar-divider"></span>
          <button id="btn-save" class="btn" title="保存项目 (Ctrl+S)">
            <span class="btn-ic"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 4v5h7V4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
            <span class="btn-label">保存</span>
          </button>
          <button id="btn-fonts" class="btn" title="字体管理：添加本地/网络字体，导出时嵌入">
            <span class="btn-ic"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <span class="btn-label">字体</span>
          </button>
          <button id="btn-theme" class="btn" title="配色：预设色板与语义色编辑">
            <span class="btn-ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.6a1.6 1.6 0 0 0 0-3.2H12a1.6 1.6 0 0 1 0-3.2h4.4A4.6 4.6 0 0 0 21 10C21 6.1 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.4" cy="10.6" r="1.1" fill="currentColor"/><circle cx="11.8" cy="7.4" r="1.1" fill="currentColor"/><circle cx="16.4" cy="8.6" r="1.1" fill="currentColor"/></svg></span>
            <span class="btn-label">配色</span>
          </button>
          <button id="btn-present" class="btn btn-present" title="放映：从当前页开始全屏演示 (F5)">
            <span class="btn-ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 21v-2M8 21h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 8.5v5l4.2-2.5z" fill="currentColor"/></svg></span>
            <span class="btn-label">放映</span>
          </button>
          <button id="btn-export" class="btn btn-primary">
            <span class="btn-ic"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <span class="btn-label">导出 PPTX</span>
          </button>
          <a class="icon-btn" href="https://github.com/Shingwha/open-pptd" target="_blank" rel="noopener" title="GitHub 仓库">
            <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
        </div>
      </header>

      <!-- 工作区 -->
      <div class="workspace">
        <!-- 画布（全宽预览） -->
        <main id="stage" class="stage">
          <div id="canvas-wrap" class="canvas-wrap">
            <div id="canvas" class="canvas"></div>
          </div>

          <!-- 选中元素时的浮动快调条 -->
          <div id="quickbar" class="quickbar"></div>

          <!-- 右下角操作组（双端统一）：属性面板入口 / 添加元素 -->
          <div class="fab-stack">
            <button id="btn-inspector-open" class="fab" title="打开/收起属性面板">
              <svg viewBox="0 0 24 24" class="fab-ic"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="6" r="2.2" fill="currentColor"/><circle cx="15" cy="12" r="2.2" fill="currentColor"/><circle cx="7" cy="18" r="2.2" fill="currentColor"/></svg>
            </button>
            <button id="btn-add" class="fab" title="添加元素">
              <svg viewBox="0 0 24 24" class="fab-ic"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>

          <!-- 画布缩放控件：浮动在画布底部中央（双端统一，远离右下角按钮组） -->
          <div id="zoom-ctl" class="zoom-ctl">
            <button id="btn-zoom-out" class="icon-btn" title="缩小">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 11h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <span id="zoom-label" class="zoom-label">100%</span>
            <button id="btn-zoom-in" class="icon-btn" title="放大">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 11h6M11 8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <span class="zoom-sep"></span>
            <button id="btn-zoom-reset" class="icon-btn" title="还原到适配视图">
              <svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="add-menu" class="add-menu"></div>

          <div class="stage-status" id="stage-status"></div>
        </main>

        <!-- 右侧属性抽屉 -->
        <aside class="inspector" id="inspector">
          <div class="inspector-head">
            <div class="inspector-title-row">
              <span id="inspector-badge" class="inspector-badge" hidden></span>
              <span id="inspector-title">属性</span>
            </div>
            <button id="btn-inspector-toggle" class="icon-btn" title="收起属性面板">
              <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="props"></div>
        </aside>

      </div>

      <!-- 窄屏属性面板遮罩 -->
      <div id="inspector-mask" class="inspector-mask"></div>

      <!-- 底部页面缩略条 -->
      <footer class="thumbbar">
        <div id="page-thumbs" class="page-thumbs"></div>
        <button id="btn-add-page" class="thumb-add" title="添加页面">＋</button>
        <div class="thumbbar-meta">
          <span id="page-count"></span>
        </div>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
